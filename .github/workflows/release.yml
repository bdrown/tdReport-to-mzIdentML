name: Release executables

# Build a self-contained, single-file console executable for each platform when a
# GitHub release is published (or on manual dispatch, for testing). All targets are
# cross-published from a single Ubuntu runner.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
            artifact: tdReportConverter-win-x64
          - rid: linux-x64
            archive: tar.gz
            artifact: tdReportConverter-linux-x64
          - rid: osx-x64
            archive: tar.gz
            artifact: tdReportConverter-osx-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained executable
        run: >-
          dotnet publish src/NRTDP.ReportConverter.ConsoleApp/NRTDP.tdReportConverter.ConsoleApp.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.artifact }}

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C publish ${{ matrix.artifact }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: cd publish && zip -r ../${{ matrix.artifact }}.zip ${{ matrix.artifact }}

      - name: Upload release asset
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ matrix.artifact }}.${{ matrix.archive }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}
